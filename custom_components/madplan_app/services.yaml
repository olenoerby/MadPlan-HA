add_to_shopping_list:
  fields:
    name:
      required: true
      example: Toiletpapir
      selector:
        text:

update_pantry:
  fields:
    name:
      required: true
      example: Mælk
      selector:
        text:
    quantity:
      example: 2
      selector:
        number:
          min: 0
          max: 100000
          step: 0.1
          mode: box
    unit:
      example: l
      selector:
        text:
    expires_on:
      selector:
        date:
    min_quantity:
      example: 4
      selector:
        number:
          min: 0
          max: 100000
          step: 0.1
          mode: box

vote_meal:
  fields:
    meal_id:
      required: true
      example: 42
      selector:
        number:
          min: 1
          max: 2147483647
          mode: box
    vote:
      required: true
      selector:
        select:
          options:
            - "yes"
            - "no"

meal_cooked:
  fields:
    meal_id:
      required: true
      example: 42
      selector:
        number:
          min: 1
          max: 2147483647
          mode: box
    cooked:
      required: true
      selector:
        boolean:

