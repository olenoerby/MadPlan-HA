name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Home Assistant changes its rules now and then, so the checks also run once a week.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # These only apply once the repository is submitted to the HACS store.
          ignore: brands
